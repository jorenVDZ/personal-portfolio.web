<app-scrolly [count]="steps.length" (activeChange)="i.set($event)">
  <div head class="mb-6">
    <span class="pill mb-4">02 / {{ 'chapter.label' | translate }}</span>
    <h1 [innerHTML]="'about.heading' | translate"></h1>
    <p class="text-lg" [innerHTML]="'about.intro' | translate"></p>
  </div>
  @for (s of steps; track s; let n = $index) {
    <section class="step" [class.is-active]="i() === n">
      <span class="dot"></span>
      <p class="label !text-slate-300">0{{ n + 1 }}</p>
      <h3 class="!mt-1">{{ 'about.' + s + '.title' | translate }}</h3>
      <div class="step-body">
        <p class="text-lg mt-2" [innerHTML]="'about.' + s + '.text' | translate"></p>
        <img class="lg:hidden mt-4 rounded-xl border border-slate-700 max-h-80 w-full object-cover" [style.object-position]="photos[n].pos" [src]="photos[n].src" [alt]="'about.' + s + '.title' | translate">
      </div>
    </section>
  }
  <div panel class="card-flat p-3">
    <img class="rounded-lg w-full h-[60svh] object-cover" [style.object-position]="photos[i()].pos" [src]="photos[i()].src" [alt]="'about.' + steps[i()] + '.title' | translate">
    <div class="p-3 flex items-center justify-between gap-4">
      <p class="font-semibold text-slate-100">{{ 'about.' + steps[i()] + '.title' | translate }}</p>
      <span class="label shrink-0">0{{ i() + 1 }} / 0{{ steps.length }}</span>
    </div>
  </div>
</app-scrolly>
