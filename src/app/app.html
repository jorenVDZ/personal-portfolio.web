<div class="relative h-screen overflow-hidden">
  <div class="fixed top-0 left-0 w-full h-full -z-10 bg-slate-900"></div>
  <ngx-particles
      [id]="id"
      [options]="particlesOptions"
      [particlesInit]="particlesInit.bind(this)">
    </ngx-particles>
  <app-progress-rail></app-progress-rail>
  <div class="overflow-y-scroll h-screen relative z-10">
    <app-navigation class="fixed top-0 left-0 w-full z-20"></app-navigation>
    <app-home-page class="block" id="home"></app-home-page>
    <app-about-page class="block" id="about"></app-about-page>
    <app-career-page class="block" id="career"></app-career-page>
    <app-skills-page class="block" id="skills"></app-skills-page>
    <app-contact-page class="block" id="contact"></app-contact-page>
  </div>
</div>
